name: Demo browser checks
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'templates/**'
      - 'static/**'
      - 'scripts/build-original-demo.py'
      - 'tests/browser/**'
      - 'playwright.config.cjs'
      - 'package.json'
      - '.github/workflows/demo-checks.yml'
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-alpha.txt
      - run: python scripts/build-original-demo.py
      - run: npm install --ignore-scripts --package-lock=false
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - name: Verify standalone Retro demo package
        run: |
          python scripts/package-demo.py --source-commit "$GITHUB_SHA"
          python scripts/check-demo-package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
