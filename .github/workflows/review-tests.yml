name: Read-only review tests
on:
  pull_request:
  workflow_call:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest']
        python: ['3.10', '3.12', '3.13']
        include:
          - os: ubuntu-24.04-arm
            python: '3.13.5'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-alpha.txt
      - run: python -m pip check
      - name: Verify ARM64 target interpreter
        if: matrix.os == 'ubuntu-24.04-arm'
        run: python -c "import platform, sys; assert platform.machine() == 'aarch64'; assert sys.version_info[:3] == (3, 13, 5); print('ARM64 / Python 3.13.5 verified')"
      - run: python -m unittest discover -s tests -v
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - run: node --check static/js/app_retro.js
  application-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-alpha.txt
      - run: npm install --ignore-scripts --package-lock=false
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Fixture-only browser and accessibility checks
        env:
          VAULTPANEL_CHROMIUM_CHANNEL: bundled
        run: |
          set -euo pipefail
          python tests/browser_server.py > "$RUNNER_TEMP/fixture-server.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8091/api/capabilities > /dev/null; then break; fi
            sleep 1
          done
          for engine in chromium firefox webkit; do
            VAULTPANEL_BROWSER="$engine" node tests/browser/check.cjs
          done
          node tests/browser/accessibility.cjs
